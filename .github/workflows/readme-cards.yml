name: Actualizar tarjetas del README

on:
  schedule:
    - cron: "0 3 * * *"   # todos los días
  workflow_dispatch:       # botón "Run workflow" para ejecutarlo a mano
  push:
    branches: [main]
    paths: [".github/workflows/readme-cards.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tarjeta de Stats de GitHub
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&card_width=500&bg_color=30,4a1236,2a0a20&title_color=ff8cc6&icon_color=f472b6&text_color=ffe4f1&ring_color=f472b6&border_color=f472b6&border_radius=24&locale=es
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tarjeta de Lenguajes (Tech Stack)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=500&bg_color=30,4a1236,2a0a20&title_color=ff8cc6&text_color=ffe4f1&border_color=f472b6&border_radius=24&locale=es
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualizar tarjetas del README" || exit 0
          git push
