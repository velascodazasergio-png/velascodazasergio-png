  @keyframes up{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .up{animation:up .8s ease-out both}
  @keyframes pg{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.45);opacity:0}}
  .ping{animation:pg 2.4s ease-out infinite}
  @keyframes flow{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
  .flow{stroke-dasharray:6 14;animation:flow 1.2s linear infinite}
 </style>
