<rect x="40" y="0" width="90" height="4" rx="2" fill="url(#bar)"/>
<g transform="translate(40,38)">
 <rect width="52" height="52" rx="14" fill="#1a0714" fill-opacity=".6" stroke="#f472b6" stroke-opacity=".8"/>
 <g transform="translate(26,26)" fill="none" stroke="#f472b6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-7" width="24" height="18" rx="5"/><path d="M0 -7v-5"/><circle cx="0" cy="-13" r="1.5"/><circle cx="-5" cy="2" r="1.6"/><circle cx="5" cy="2" r="1.6"/></g>
</g>
<text x="108" y="74" class="t">HelpDesk AI</text>
<rect x="386" y="44" width="174" height="24" rx="12" fill="#f9a8d4"/>
