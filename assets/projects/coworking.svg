<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a1236"/><stop offset=".6" stop-color="#2a0a20"/><stop offset="1" stop-color="#3b1030"/></linearGradient>
 <radialGradient id="gl" cx=".95" cy="0" r=".7"><stop offset="0" stop-color="#c98cff" stop-opacity=".45"/><stop offset="1" stop-color="#c98cff" stop-opacity="0"/></radialGradient>
 <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c98cff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
 <style>
  .t{font:800 28px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#ffe4f1}
  .d{font:400 17px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#f9a8d4}
  .tag{font:700 14px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#ffe4f1}
  .b{font:800 12px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#2a0a20;letter-spacing:1px}
  .ar{font:800 26px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#c98cff}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .glow{animation:pulse 5s ease-in-out infinite}
  @keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
  .mv{animation:slide 2.2s ease-in-out infinite}
 </style>
</defs>
<rect x="1.5" y="1.5" width="597" height="277" rx="26" fill="url(#bg)" stroke="#c98cff" stroke-opacity=".55" stroke-width="1.5"/>
<rect x="1.5" y="1.5" width="597" height="277" rx="26" fill="url(#gl)" class="glow"/>
<rect x="40" y="0" width="90" height="4" rx="2" fill="url(#bar)"/>
<g transform="translate(40,38)">
 <rect width="52" height="52" rx="14" fill="#1a0714" fill-opacity=".6" stroke="#c98cff" stroke-opacity=".8"/>
 <g transform="translate(26,26)" fill="none" stroke="#c98cff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="11" ry="4"/><path d="M-11 -8v16c0 2.2 4.9 4 11 4s11-1.8 11-4V-8M-11 0c0 2.2 4.9 4 11 4s11-1.8 11-4"/></g>
</g>
<text x="108" y="74" class="t">CoworkingSpace</text>
<rect x="436" y="44" width="124" height="24" rx="12" fill="#f9a8d4"/>
<text x="498" y="60" text-anchor="middle" class="b">BASE DE DATOS</text>
<text y="130" class="d"><tspan x="40" dy="0">Sistema relacional para un coworking: 100</tspan><tspan x="40" dy="26">consultas SQL, 20 triggers, 20 eventos, 20</tspan><tspan x="40" dy="26">procedimientos y 5 roles con permisos.</tspan></text>
<rect x="40" y="214" width="76" height="30" rx="15" fill="#2a0f22" fill-opacity=".7" stroke="#f472b6" stroke-opacity=".6"/><text x="78" y="234" text-anchor="middle" class="tag">MySQL</text><rect x="126" y="214" width="55" height="30" rx="15" fill="#2a0f22" fill-opacity=".7" stroke="#f472b6" stroke-opacity=".6"/><text x="153" y="234" text-anchor="middle" class="tag">SQL</text><rect x="191" y="214" width="89" height="30" rx="15" fill="#2a0f22" fill-opacity=".7" stroke="#f472b6" stroke-opacity=".6"/><text x="235" y="234" text-anchor="middle" class="tag">Triggers</text><rect x="290" y="214" width="65" height="30" rx="15" fill="#2a0f22" fill-opacity=".7" stroke="#f472b6" stroke-opacity=".6"/><text x="322" y="234" text-anchor="middle" class="tag">Roles</text>
<text x="556" y="238" text-anchor="end" class="ar mv">→</text>
