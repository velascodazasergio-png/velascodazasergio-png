<g transform="translate(40,38)">
 <rect width="52" height="52" rx="14" fill="#1a0714" fill-opacity=".6" stroke="#ff8ef5" stroke-opacity=".8"/>
 <g transform="translate(26,26)" fill="none" stroke="#ff8ef5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 -8h17v15h-17z"/><path d="M2 -3h7l5 5v5h-12"/><circle cx="-9" cy="10" r="3"/><circle cx="8" cy="10" r="3"/></g>
</g>
<text x="108" y="74" class="t">RapidExpress</text>
