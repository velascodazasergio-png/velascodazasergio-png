<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a1236"/><stop offset=".7" stop-color="#2a0a20"/><stop offset="1" stop-color="#3b1030"/></linearGradient>
 <linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8cc6"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
 <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe4f1" stop-opacity="0"/><stop offset=".5" stop-color="#ffe4f1" stop-opacity=".18"/><stop offset="1" stop-color="#ffe4f1" stop-opacity="0"/></linearGradient>
 <clipPath id="c"><rect x="1.5" y="1.5" width="1197" height="93" rx="22"/></clipPath>
 <style>
  .n{font:900 52px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:none;stroke:url(#n);stroke-width:1.6;letter-spacing:2px}
  .t{font:800 30px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#ffe4f1}
  .s{font:500 16px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#f9a8d4}
  .g{font:600 14px 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace;fill:#f9a8d4;opacity:.75}
  @keyframes sw{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1300px)}}
  .sw{animation:sw 6s ease-in-out infinite}
  @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  .in{animation:in .8s ease-out both}
 </style>
</defs>
<rect x="1.5" y="1.5" width="1197" height="93" rx="22" fill="url(#bg)" stroke="#f472b6" stroke-opacity=".5" stroke-width="1.5"/>
<g clip-path="url(#c)"><rect class="sw" x="0" y="0" width="300" height="96" fill="url(#sw)" transform="skewX(-20)"/></g>
<text x="36" y="67" class="n">02</text>
<rect x="128" y="24" width="3" height="48" rx="1.5" fill="url(#n)"/>
<g class="in"><text x="152" y="48" class="t">Lo que hago</text>
<text x="152" y="74" class="s">Herramientas y especialidades</text></g>
<text x="1164" y="54" text-anchor="end" class="g">// stack.config</text>
</svg>