<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a1236"/><stop offset=".6" stop-color="#2a0a20"/><stop offset="1" stop-color="#3b1030"/></linearGradient>
 <radialGradient id="gl" cx=".18" cy=".5" r=".45"><stop offset="0" stop-color="#ff69b4" stop-opacity=".4"/><stop offset="1" stop-color="#ff69b4" stop-opacity="0"/></radialGradient>
 <radialGradient id="body" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ffd1e8"/><stop offset=".55" stop-color="#ff8cc6"/><stop offset="1" stop-color="#e65aa0"/></radialGradient>
 <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c1a45"/><stop offset="1" stop-color="#3b1030"/></linearGradient>
 <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8cc6"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
 <style>
  .t{font:800 30px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#ffe4f1}
  .s{font:400 18px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#f9a8d4}
  .m{font:600 15px 'Cascadia Code',Consolas,Menlo,monospace;fill:#f9a8d4}
  .b{font:700 15px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#2a0a20}
  .f{font:700 18px 'Cascadia Code',Consolas,Menlo,monospace}

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .bob{animation:bob 1.6s ease-in-out infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
  @keyframes earL{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-10deg)}}
  @keyframes earR{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(10deg)}}
  .earL{transform-box:fill-box;transform-origin:bottom center;animation:earL 3.5s infinite}
  .earR{transform-box:fill-box;transform-origin:bottom center;animation:earR 3.5s infinite}
  @keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .pL{animation:tap .32s ease-in-out infinite}
  .pR{animation:tap .32s ease-in-out .16s infinite}
  @keyframes rise{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-120px)}}
  .fl{animation:rise 3.6s ease-out infinite}
  @keyframes msg{0%,2%{opacity:0}5%,30%{opacity:1}33%,100%{opacity:0}}
  .msg{opacity:0;animation:msg 9s infinite}
  @keyframes load{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
  .load{transform-origin:520px 0;animation:load 4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
  .glow{animation:glow 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
 </style>
</defs>

<rect x="1.5" y="1.5" width="1197" height="237" rx="28" fill="url(#bg)" stroke="#f472b6" stroke-opacity=".55" stroke-width="1.5"/>
<rect x="1.5" y="1.5" width="1197" height="237" rx="28" fill="url(#gl)" class="glow"/>

<!-- destellos -->
<path class="tw" d="M60 50l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#f9a8d4"/>
<path class="tw" style="animation-delay:.8s" d="M330 190l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#c084fc"/>
<path class="tw" style="animation-delay:1.5s" d="M120 200l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#ff8cc6"/>

<!-- símbolos que flotan desde la laptop -->
<g transform="translate(205,150)">
 <text class="f fl" style="--dx:-30px;fill:#ff8cc6">{ }</text>
 <text class="f fl" style="--dx:25px;fill:#c084fc;animation-delay:.9s">&lt;/&gt;</text>
 <text class="f fl" style="--dx:-10px;fill:#f9a8d4;animation-delay:1.8s">;</text>
 <text class="f fl" style="--dx:40px;fill:#ff5f87;animation-delay:2.7s">♥</text>
</g>

<!-- sombra -->
<ellipse cx="200" cy="214" rx="78" ry="9" fill="#1a0714" opacity=".6"/>

<!-- mascota -->
<g class="bob">
 <!-- orejas de gato -->
 <g class="earL"><path d="M150 82 L140 34 Q143 28 149 31 L182 62Z" fill="#ff8cc6"/><path d="M152 72 L147 44 L170 63Z" fill="#db2777" opacity=".7"/></g>
 <g class="earR"><path d="M250 82 L260 34 Q257 28 251 31 L218 62Z" fill="#ff8cc6"/><path d="M248 72 L253 44 L230 63Z" fill="#db2777" opacity=".7"/></g>
 <!-- cuerpo -->
 <ellipse cx="200" cy="128" rx="74" ry="66" fill="url(#body)"/>
 <!-- mechón -->
 <path d="M192 64 Q200 50 210 60 Q203 58 200 66Z" fill="#ff8cc6"/>
 <!-- ojos -->
 <g class="eye"><ellipse cx="176" cy="116" rx="8" ry="12" fill="#2a0a20"/><circle cx="179" cy="110" r="3.2" fill="#fff"/></g>
 <g class="eye"><ellipse cx="224" cy="116" rx="8" ry="12" fill="#2a0a20"/><circle cx="227" cy="110" r="3.2" fill="#fff"/></g>
 <!-- mejillas -->
 <ellipse cx="160" cy="138" rx="11" ry="6" fill="#ff5f87" opacity=".55"/>
 <ellipse cx="240" cy="138" rx="11" ry="6" fill="#ff5f87" opacity=".55"/>
 <!-- boca -->
 <path d="M192 136 q4 5 8 0 q4 5 8 0" fill="none" stroke="#2a0a20" stroke-width="2.4" stroke-linecap="round"/>
</g>

<!-- laptop (vista trasera) -->
<path d="M138 210 L262 210 L252 198 L148 198Z" fill="#9d2a6e"/>
<rect x="148" y="146" width="104" height="54" rx="8" fill="url(#lid)" stroke="#f472b6" stroke-opacity=".7"/>
<text x="200" y="180" text-anchor="middle" style="font:800 18px 'Segoe UI',Arial,sans-serif;fill:#ff8cc6">SV</text>
<!-- patitas tecleando -->
<ellipse class="pL" cx="152" cy="196" rx="13" ry="9" fill="#ffb6d9"/>
<ellipse class="pR" cx="248" cy="196" rx="13" ry="9" fill="#ffb6d9"/>

<!-- globo de diálogo -->
<g transform="translate(296,40)">
 <path d="M0 0h196a14 14 0 0 1 14 14v22a14 14 0 0 1-14 14H22l-14 12 2-12H0a14 14 0 0 1-14-14V14A14 14 0 0 1 0 0z" fill="#ffe4f1"/>
 <text x="98" y="31" text-anchor="middle" class="b msg">¡Hola! Soy Pixi 👋</text>
 <text x="98" y="31" text-anchor="middle" class="b msg" style="animation-delay:3s">Compilando ideas...</text>
 <text x="98" y="31" text-anchor="middle" class="b msg" style="animation-delay:6s">BUILD SUCCESS ✓</text>
</g>

<!-- texto -->
<text x="520" y="100" class="t">Gracias por pasar por aquí</text>
<text x="520" y="132" class="s">Pixi y yo seguimos programando cosas nuevas cada día.</text>
<text x="520" y="174" class="m">$ mvn clean install</text>
<rect x="520" y="188" width="560" height="10" rx="5" fill="#1a0714" fill-opacity=".7"/>
<rect class="load" x="520" y="188" width="560" height="10" rx="5" fill="url(#bar)"/>
<text x="1080" y="174" text-anchor="end" class="m" style="fill:#86efac">✓ OK</text>
</svg>
