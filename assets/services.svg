 </g>
 <text x="100" y="66" class="t">Backend en Java</text>
 <text y="122" class="d"><tspan x="32" dy="0">Aplicaciones con Java y Maven</tspan><tspan x="32" dy="24">organizadas en arquitectura MVC</tspan><tspan x="32" dy="24">y capas bien separadas.</tspan></text>
 <text x="358" y="196" text-anchor="end" class="k">01</text>
