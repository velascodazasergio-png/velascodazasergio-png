<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a1236"/><stop offset=".6" stop-color="#2a0a20"/><stop offset="1" stop-color="#3b1030"/></linearGradient>
 <style>
  .t{font:800 21px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#ffe4f1}
  .d{font:400 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#f9a8d4}
  .k{font:900 28px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#f472b6;opacity:.25}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .up{animation:up .8s ease-out both}
 </style>
</defs>
<g class="up" style="animation-delay:0.00s">
 <rect x="1.5" y="1.5" width="291" height="227" rx="22" fill="url(#bg)" stroke="#ff8cc6" stroke-opacity=".5" stroke-width="1.5"/>
 <rect x="28" y="0" width="60" height="4" rx="2" fill="#ff8cc6"/>
 <g transform="translate(28,28)">
  <rect width="52" height="52" rx="16" fill="#1a0714" fill-opacity=".6" stroke="#ff8cc6" stroke-opacity=".8"/>
  <g transform="translate(26,26)" fill="none" stroke="#ff8cc6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-6 -9l-8 9 8 9M6 -9l8 9-8 9"/></g>
 </g>
 <text x="262" y="62" text-anchor="end" class="k">01</text>
 <text x="28" y="118" class="t">Backend y sistemas</text>
 <text y="150" class="d"><tspan x="28" dy="0">Java, Spring Boot y Node.js;</tspan><tspan x="28" dy="23">sistemas CLI con MVC y</tspan><tspan x="28" dy="23">capas bien separadas.</tspan></text>
</g><g class="up" style="animation-delay:0.12s">
 <rect x="304.5" y="1.5" width="291" height="227" rx="22" fill="url(#bg)" stroke="#f472b6" stroke-opacity=".5" stroke-width="1.5"/>
 <rect x="331" y="0" width="60" height="4" rx="2" fill="#f472b6"/>
 <g transform="translate(331,28)">
  <rect width="52" height="52" rx="16" fill="#1a0714" fill-opacity=".6" stroke="#f472b6" stroke-opacity=".8"/>
  <g transform="translate(26,26)" fill="none" stroke="#f472b6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="11" ry="4"/><path d="M-11 -8v16c0 2.2 4.9 4 11 4s11-1.8 11-4V-8M-11 0c0 2.2 4.9 4 11 4s11-1.8 11-4"/></g>
 </g>
 <text x="565" y="62" text-anchor="end" class="k">02</text>
 <text x="331" y="118" class="t">Bases de datos</text>
 <text y="150" class="d"><tspan x="331" dy="0">MySQL y PostgreSQL con</tspan><tspan x="331" dy="23">triggers, procedimientos,</tspan><tspan x="331" dy="23">eventos y roles.</tspan></text>
</g><g class="up" style="animation-delay:0.24s">
 <rect x="607.5" y="1.5" width="291" height="227" rx="22" fill="url(#bg)" stroke="#c084fc" stroke-opacity=".5" stroke-width="1.5"/>
 <rect x="634" y="0" width="60" height="4" rx="2" fill="#c084fc"/>
 <g transform="translate(634,28)">
  <rect width="52" height="52" rx="16" fill="#1a0714" fill-opacity=".6" stroke="#c084fc" stroke-opacity=".8"/>
  <g transform="translate(26,26)" fill="none" stroke="#c084fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-13" y="-11" width="26" height="22" rx="4"/><path d="M-13 -4h26"/><path d="M-5 2l-3 3 3 3M5 2l3 3-3 3"/></g>
 </g>
 <text x="868" y="62" text-anchor="end" class="k">03</text>
 <text x="634" y="118" class="t">Frontend web</text>
 <text y="150" class="d"><tspan x="634" dy="0">Interfaces modernas y</tspan><tspan x="634" dy="23">responsivas con React,</tspan><tspan x="634" dy="23">TypeScript, HTML y CSS.</tspan></text>
</g><g class="up" style="animation-delay:0.36s">
 <rect x="910.5" y="1.5" width="291" height="227" rx="22" fill="url(#bg)" stroke="#ffd66b" stroke-opacity=".5" stroke-width="1.5"/>
 <rect x="937" y="0" width="60" height="4" rx="2" fill="#ffd66b"/>
 <g transform="translate(937,28)">
  <rect width="52" height="52" rx="16" fill="#1a0714" fill-opacity=".6" stroke="#ffd66b" stroke-opacity=".8"/>
  <g transform="translate(26,26)" fill="none" stroke="#ffd66b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="-9" cy="-8" r="4"/><circle cx="9" cy="8" r="4"/><path d="M-9 -4v4a4 4 0 0 0 4 4h10"/></g>
 </g>
 <text x="1171" y="62" text-anchor="end" class="k">04</text>
 <text x="937" y="118" class="t">Automatización e IA</text>
 <text y="150" class="d"><tspan x="937" dy="0">Flujos con n8n integrados</tspan><tspan x="937" dy="23">con OpenAI GPT-4,</tspan><tspan x="937" dy="23">PostgreSQL y Telegram.</tspan></text>
</g>
</svg>