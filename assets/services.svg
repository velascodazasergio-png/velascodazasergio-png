  <rect width="52" height="52" rx="16" fill="#1a0714" fill-opacity=".6" stroke="#c084fc" stroke-opacity=".8"/>
  <g transform="translate(26,26)" fill="none" stroke="#c084fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-13" y="-11" width="26" height="22" rx="4"/><path d="M-13 -4h26"/><circle cx="-8" cy="-7.5" r=".8"/></g>
 </g>
 <text x="908" y="66" class="t">Interfaces web</text>
 <text y="122" class="d"><tspan x="840" dy="0">Páginas dinámicas y animadas</tspan><tspan x="840" dy="24">con HTML, CSS y JavaScript,</tspan><tspan x="840" dy="24">publicadas en Netlify.</tspan></text>
 <text x="1166" y="196" text-anchor="end" class="k">03</text>
