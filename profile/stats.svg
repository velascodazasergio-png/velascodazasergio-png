  .s{font:600 12px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#f9a8d4;opacity:.75}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .glow{animation:pulse 5s ease-in-out infinite}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .up{animation:up .7s ease-out both}
  
 </style>
</defs>
<rect x="1.5" y="1.5" width="597" height="297" rx="26" fill="url(#bg)" stroke="#f472b6" stroke-opacity=".55" stroke-width="1.5"/>
